name: DK Tweak CI/CD - Auto Build & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本递增类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Build DK Tweak
    runs-on: macos-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore: bump version')

    steps:
      # ============================================================
      # 1. 检出代码
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. 读取当前版本号
      # ============================================================
      - name: Read Current Version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="1.0.0"
            echo "$VERSION" > VERSION
          fi
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current Version: $VERSION"

      # ============================================================
      # 3. 自动递增版本号
      # ============================================================
      - name: Bump Version
        id: bump
        run: |
          CURRENT="${{ steps.version.outputs.current_version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New Version: $NEW_VERSION"

          echo "$NEW_VERSION" > VERSION
          sed -i '' "s/Version: .*/Version: $NEW_VERSION/" control 2>/dev/null || \
          sed -i "s/Version: .*/Version: $NEW_VERSION/" control

      # ============================================================
      # 4. 安装系统依赖
      # ============================================================
      - name: Install Dependencies
        run: |
          if ! command -v dpkg-deb &> /dev/null; then
            brew install dpkg
          fi
          if ! command -v ldid &> /dev/null; then
            brew install ldid
          fi
          # 确保 Perl 模块可用（Theos 依赖）
          perl -e 'use IO::Compress::Lzma' 2>/dev/null || \
          brew install perl 2>/dev/null || true
          echo "Dependencies ready"

      # ============================================================
      # 5. Compute cache key
      # ============================================================
      - name: Compute Theos Cache Key
        run: |
          echo "theos_head=$(git ls-remote https://github.com/theos/theos HEAD | cut -f1)" >> $GITHUB_ENV
          echo "sdks_head=$(git ls-remote https://github.com/theos/sdks HEAD | cut -f1)" >> $GITHUB_ENV

      - name: Restore Theos Cache
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos2-${{ runner.os }}-${{ env.theos_head }}-${{ env.sdks_head }}

      # ============================================================
      # 6. 安装 Theos + SDK（手动，不使用 theos-action 避免兼容性问题）
      # ============================================================
      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          THEOS_DIR="${{ github.workspace }}/theos"
          echo "Installing Theos to $THEOS_DIR"

          # 克隆 theos（浅克隆加速）
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS_DIR"

          # 创建 sdks 目录并下载 SDK
          rm -rf "$THEOS_DIR/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS_DIR/sdks"

          echo "Theos installed successfully"
          ls -la "$THEOS_DIR/sdks/"

      # ============================================================
      # 7. 验证环境
      # ============================================================
      - name: Verify Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"
          echo "THEOS=$THEOS"
          echo "SDKs:"
          ls -la "$THEOS/sdks/" 2>/dev/null || echo "SDK dir missing"
          echo "Theos ready"

      # ============================================================
      # 8. 编译
      # ============================================================
      - name: Build Tweak
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean 2>/dev/null || true
          make package FINALPACKAGE=1

          echo "=== Packages ==="
          ls -la packages/ 2>/dev/null || echo "No packages"
          echo "=== Dylibs ==="
          find .theos -name "*.dylib" -type f 2>/dev/null || echo "No dylib"

      # ============================================================
      # 9. 收集产物
      # ============================================================
      - name: Collect Artifacts
        run: |
          mkdir -p release_artifacts
          ls packages/*.deb 1>/dev/null 2>&1 && cp packages/*.deb release_artifacts/

          FOUND_DYLIB=$(find .theos -name "dk.dylib" -type f 2>/dev/null | head -1)
          if [ -n "$FOUND_DYLIB" ]; then
            cp "$FOUND_DYLIB" release_artifacts/
          fi

          ls -la release_artifacts/

      # ============================================================
      # 10. 生成更新日志
      # ============================================================
      - name: Generate Changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          TODAY=$(date +%Y-%m-%d)

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges -10)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --no-merges)
          fi

          CHANGELOG_ENTRY="## [${NEW_VERSION}] - ${TODAY}"$'\n\n'
          if [ -z "$COMMITS" ]; then
            CHANGELOG_ENTRY+="- 自动构建版本更新"
          else
            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG_ENTRY+="- ${line}"$'\n'
            done <<< "$COMMITS"
          fi

          if [ -f CHANGELOG.md ]; then
            HEADER=$(head -1 CHANGELOG.md)
            CONTENT=$(tail -n +2 CHANGELOG.md)
            printf "%s\n\n%s\n%s" "$HEADER" "$CHANGELOG_ENTRY" "$CONTENT" > CHANGELOG.md
          fi

          echo "changelog_entry<<DKEOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ENTRY" >> $GITHUB_OUTPUT
          echo "DKEOF" >> $GITHUB_OUTPUT

      # ============================================================
      # 11. 提交版本号
      # ============================================================
      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION control CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || echo "No changes"
          git tag "v${{ steps.bump.outputs.new_version }}"

      - name: Push Changes
        run: git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 12. 创建 Release
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: DK v${{ steps.bump.outputs.new_version }}
          body: |
            ## DK Multi-Account Tweak v${{ steps.bump.outputs.new_version }}

            ${{ steps.changelog.outputs.changelog_entry }}

            ### 构建产物
            - `dk.deb` — Cydia / Sileo / Zebra 安装包
            - `dk.dylib` — 动态链接库
          files: release_artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 13. Artifact
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dk-tweak-v${{ steps.bump.outputs.new_version }}
          path: release_artifacts/
          retention-days: 30