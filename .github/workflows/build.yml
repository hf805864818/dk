name: DK Tweak CI/CD - Auto Build & Release

# 触发条件：push 到 main 分支（跳过 bot 自动提交）
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      version_bump:
        description: '版本递增类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    name: Build DK Tweak
    runs-on: macos-latest
    # 跳过 bot 自动提交和 [skip ci] 标记的提交
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, 'chore: bump version')

    steps:
      # ============================================================
      # 1. 检出代码
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 2. 读取当前版本号
      # ============================================================
      - name: Read Current Version
        id: version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="1.0.0"
            echo "$VERSION" > VERSION
          fi
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Current Version: $VERSION"

      # ============================================================
      # 3. 自动递增版本号
      # ============================================================
      - name: Bump Version
        id: bump
        run: |
          CURRENT="${{ steps.version.outputs.current_version }}"
          BUMP_TYPE="${{ github.event.inputs.version_bump || 'patch' }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch|*)
              PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "🔖 New Version: $NEW_VERSION"

          # 更新 VERSION 文件
          echo "$NEW_VERSION" > VERSION

          # 更新 control 文件中的版本号（影响 .deb 包名）
          sed -i '' "s/Version: .*/Version: $NEW_VERSION/" control 2>/dev/null || \
          sed -i "s/Version: .*/Version: $NEW_VERSION/" control

          # 注意：Tweak.x 中的版本号不再需要手动替换
          # Makefile 编译时自动从 VERSION 文件读取并通过 -DDK_VERSION 宏注入

      # ============================================================
      # 4. 安装 dpkg（用于打包 .deb）
      # ============================================================
      - name: Install Dependencies
        run: |
          # 安装 dpkg 用于 deb 打包
          if ! command -v dpkg-deb &> /dev/null; then
            echo "Installing dpkg..."
            brew install dpkg 2>/dev/null || echo "dpkg may already be available"
          fi

          # 安装 ldid 用于签名
          if ! command -v ldid &> /dev/null; then
            echo "Installing ldid..."
            brew install ldid 2>/dev/null || echo "ldid may already be available"
          fi

          echo "✅ Dependencies installed"

      # ============================================================
      # 5. 缓存 Theos 和 SDK
      # ============================================================
      - name: Compute Theos Cache Key
        run: |
          echo "theos_head=$(git ls-remote https://github.com/theos/theos HEAD | cut -f1)" >> $GITHUB_ENV
          echo "sdks_head=$(git ls-remote https://github.com/theos/sdks HEAD | cut -f1)" >> $GITHUB_ENV

      - name: Restore Theos Cache
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ env.theos_head }}-${{ env.sdks_head }}

      # ============================================================
      # 6. 安装 Theos（使用 theos-action）
      # ============================================================
      - name: Setup Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'
          theos-src: 'https://github.com/theos/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      # 如果缓存命中，也确保 theos-action 加载了环境
      - name: Verify Theos
        run: |
          export THEOS="${{ github.workspace }}/theos"
          if [ ! -d "$THEOS" ]; then
            echo "⚠️ Theos not found, installing..."
            # Fallback: clone manually
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
            # Clone SDKs
            if [ ! -d "$THEOS/sdks" ] || [ ! "$(ls -A $THEOS/sdks 2>/dev/null)" ]; then
              git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
            fi
          fi
          echo "Theos path: $THEOS"
          ls -la "$THEOS/sdks/" 2>/dev/null || echo "No SDKs directory"
          echo "✅ Theos ready"

      # ============================================================
      # 7. 编译 Tweak
      # ============================================================
      - name: Build Tweak
        run: |
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          echo "🔨 Starting build..."
          echo "THEOS=$THEOS"
          echo "PATH=$PATH"

          # 清理旧构建
          make clean 2>/dev/null || true

          # 编译打包
          make package FINALPACKAGE=1

          echo "📦 Build completed!"
          echo ""
          echo "=== Build Artifacts ==="
          ls -la packages/ 2>/dev/null || echo "⚠️ No packages directory"
          ls -la .theos/obj/ 2>/dev/null | grep dylib || echo "⚠️ No dylib found"

      # ============================================================
      # 8. 收集构建产物
      # ============================================================
      - name: Collect Artifacts
        run: |
          mkdir -p release_artifacts

          # 复制 .deb 文件
          if ls packages/*.deb 1>/dev/null 2>&1; then
            cp packages/*.deb release_artifacts/
            echo "✅ .deb collected"
          fi

          # 复制 .dylib 文件
          DYLIB_FOUND=false
          if [ -f ".theos/obj/debug/arm64/dk.dylib" ]; then
            cp .theos/obj/debug/arm64/dk.dylib release_artifacts/
            DYLIB_FOUND=true
          elif [ -f ".theos/obj/dk.dylib" ]; then
            cp .theos/obj/dk.dylib release_artifacts/
            DYLIB_FOUND=true
          else
            FOUND_DYLIB=$(find .theos -name "dk.dylib" -type f 2>/dev/null | head -1)
            if [ -n "$FOUND_DYLIB" ]; then
              cp "$FOUND_DYLIB" release_artifacts/
              DYLIB_FOUND=true
            fi
          fi

          if [ "$DYLIB_FOUND" = true ]; then
            echo "✅ .dylib collected"
          else
            echo "⚠️ No .dylib found"
          fi

          echo ""
          echo "=== Release Artifacts ==="
          ls -la release_artifacts/

      # ============================================================
      # 9. 生成更新日志
      # ============================================================
      - name: Generate Changelog
        id: changelog
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          TODAY=$(date +%Y-%m-%d)

          # 获取最近的 commit 消息
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges -10)
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --oneline --no-merges)
          fi

          CHANGELOG_ENTRY="## [${NEW_VERSION}] - ${TODAY}"
          CHANGELOG_ENTRY+=$'\n\n'
          if [ -z "$COMMITS" ]; then
            CHANGELOG_ENTRY+="- 自动构建版本更新"
          else
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                CHANGELOG_ENTRY+="- ${line}"$'\n'
              fi
            done <<< "$COMMITS"
          fi

          # 更新 CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            HEADER=$(head -1 CHANGELOG.md)
            CONTENT=$(tail -n +2 CHANGELOG.md)
            printf "%s\n\n%s\n%s" "$HEADER" "$CHANGELOG_ENTRY" "$CONTENT" > CHANGELOG.md
          fi

          # 写入 GitHub Actions 输出（需要转义换行）
          echo "changelog_entry<<DKEOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_ENTRY" >> $GITHUB_OUTPUT
          echo "DKEOF" >> $GITHUB_OUTPUT

          echo "📝 Changelog generated"

      # ============================================================
      # 10. 提交版本号更新（[skip ci] 防止循环触发）
      # ============================================================
      - name: Commit Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add VERSION control CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git tag "v${{ steps.bump.outputs.new_version }}"

      - name: Push Changes
        run: |
          git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 11. 创建 GitHub Release
      # ============================================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: DK v${{ steps.bump.outputs.new_version }}
          body: |
            ## DK Multi-Account Tweak v${{ steps.bump.outputs.new_version }}

            ${{ steps.changelog.outputs.changelog_entry }}

            ### 构建产物
            - `dk.deb` — Cydia / Sileo / Zebra 安装包（推荐）
            - `dk.dylib` — 动态链接库（手动注入用）

            ### 安装方式
            1. **推荐**：使用包管理器安装 `.deb` 文件
            2. **手动**：将 `dk.dylib` 注入到目标 App 中
          files: release_artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 12. 上传构建产物为 Artifact
      # ============================================================
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dk-tweak-v${{ steps.bump.outputs.new_version }}
          path: release_artifacts/
          retention-days: 30